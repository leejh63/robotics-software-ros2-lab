# bag_amcl_param.yaml
# rosbag replay + 저장된 map 기반 AMCL 전용 파라미터입니다.

amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map_lee
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /lee/scan
    tf_broadcast: true
    transform_tolerance: 1.0

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    update_min_d: 0.10
    update_min_a: 0.10
    save_pose_rate: 0.5
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
